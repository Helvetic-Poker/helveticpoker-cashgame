name: Daily cash game source check

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: daily-cashgame-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all 21 official sources
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/check-sources.py
      - name: Commit source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json
          git diff --cached --quiet || git commit -m "chore: update daily cash game source status"
          git push
