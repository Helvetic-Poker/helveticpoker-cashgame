name: Build and deploy Cash Game pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/generate-cashgame-pages.py"
      - ".github/workflows/pages.yml"
      - "CNAME"
      - "google7842e2a0234e258b.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cashgame-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate pages
        run: python scripts/generate-cashgame-pages.py
      - name: Validate generated files
        run: |
          test -s public/index.html
          test -s public/google7842e2a0234e258b.html
          test "$(find public -name index.html | wc -l)" -ge 22
          python -c "import xml.etree.ElementTree as ET; ET.parse('public/sitemap.xml')"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
